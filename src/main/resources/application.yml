spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=disable
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # La BD productiva ya existe (creada por Hibernate): Flyway la marca como baseline en
    # la versión 1 (V1__baseline no se ejecuta allí) y solo aplica V2 en adelante.
    # En una BD nueva y vacía Flyway ejecuta V1 + V2 desde cero.
    baseline-on-migrate: true
    baseline-version: 1

# Zona con la que la aplicación estampa TODA fecha (paid_at, order_date,
# attended_at, created_at). No es cosmética: define la frontera del día en
# los reportes. Un cambio de servidor no debe alterarla.
app:
  timezone: America/Lima

server:
  port: ${PORT:8080}

application:
  security:
    jwt:
      # En producción define JWT_SECRET en el .env; el valor por defecto es solo para desarrollo local
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 0
