services:
  backend:
    build: .
    container_name: facilcomanda-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
    ports:
      # Solo accesible desde el propio VPS (127.0.0.1). Nginx hará de proxy hacia afuera (paso siguiente).
      - "127.0.0.1:8080:8080"
